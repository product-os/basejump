- commits:
    - subject: Allow the app to write workflow files
      hash: 44a1bfa5c0674911ef06eca441da1aa3122af671
      body: |
        New installations of the app installed from manifest
        should have the workflow:write permission.

        Otherwise, PRs with modifications to workflow files
        will fail to rebase.

        Existing app installations will need to add this permission
        manually.
