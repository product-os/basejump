- commits:
    - subject: Rebase onto the remote base branch
      hash: 06419c38bb6abccb3d6440b324b9799d03780213
      body: |
        A fresh clone only has a local branch for the repository's default
        branch, so `git rebase <base>` failed with `fatal: invalid upstream`
        for any pull request targeting a different branch (e.g. `develop` or
        a release branch). Rebase onto `origin/<base>` instead, which also
        always reflects the remote state for the default branch.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.2.22
  title: ""
  date: 2026-10-26T17:56:22.251Z
- commits:
    - subject: Detect stale lease rejections from newer git servers
      hash: 9de8cc7f66934999018d63df1bc29b0280b98bb7
      body: |
        When the remote branch changes after the push checked the lease but
        before the remote updated the ref, newer git versions (which update refs
        in batches) reject the push with "(incorrect old value provided)" rather
        than "is at <sha> but expected <sha>", which was then reported as a
        generic failure instead of a RemoteChangedError.

        Also replace the `test.todo` for --force-with-lease failures, which
        relied on timing, with deterministic tests: one updates the remote
        branch right before the push via a wrapped simple-git `push`, the other
        updates it while the push is being received via a pre-receive hook.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.2.21
  title: ""
  date: 2026-10-26T17:19:52.473Z
- commits:
    - subject: Use a pino child logger for prefixed log messages
      hash: a68edc933276b7a23cdb95e076e57056508cf0a8
      body: |
        The prefixed logger was an object with only info/warn/error/debug, cast
        to a full pino `Logger`, so calling any other logger method on it would
        type check but fail at runtime. Use a child logger with pino's
        `msgPrefix` option instead, which logs the same output.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.2.20
