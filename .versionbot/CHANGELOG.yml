- commits:
    - subject: Only trigger on the exact `/rebase` command
      hash: 0853631760a9d349509199755f34beb11f131483
      body: |
        Any comment starting with `/rebase` triggered a rebase, including e.g.
        `/rebased manually` or other bots' commands like `/rebase-all`. Require
