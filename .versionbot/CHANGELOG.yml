- commits:
    - subject: Only allow users with write access to trigger a rebase
      hash: 425c43381ddc5325d59294c22aa0dec043be1924
      body: |
        Anyone who can comment on a pull request could trigger a rebase and
        force push of its branch, which on public repos means any GitHub user,
        e.g. to repeatedly dismiss stale approvals or churn CI.

        Check the commenter's permission level and only proceed for users with
        write (or maintain/admin) access, i.e. users who could push to the
        branch themselves. Others get a confused reaction.
      footer:
        See: https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user
        see: https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user
        Change-type: minor
        change-type: minor
      author: Pagan Gazzard
  version: 0.4.0
  title: ""
  date: 2026-10-27T02:17:51.167Z
- commits:
    - subject: Disambiguate the feature branch checkout from paths
      hash: 50c6b83889182b74831c61fcbe460f7d5fed2a84
      body: |
        `git checkout <branch>` fails with "'<branch>' could be both a local
        file and a tracking branch" when a top-level file or directory has the
        same name as the pull request's head branch (e.g. a `docs` branch in a
        repo with a `docs/` directory). Pass a trailing `--` so the branch is
        always treated as a revision.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.3.5
  title: ""
  date: 2026-10-27T02:02:16.535Z
- commits:
    - subject: Only rebase and sign the commits that were checked for verification
      hash: c17b32773f8f16bd7e75573f904a6d8dfe83c845
      body: |
        The commits' verification was checked via the API, but the rebase then
        used whatever the branch pointed at when it was cloned later on. Commits
        pushed in between (e.g. unsigned commits pushed right after commenting
        `/rebase`) would be rebased and signed with basejump's key without ever
        having been checked.

        Pin everything to the PR's head sha:
        - only consider the commits verified if the listing includes the head
          commit
        - abort with a RemoteChangedError if the cloned branch isn't at the head
          sha
        - push with `--force-with-lease=<branch>:<head sha>`
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.3.4
  title: ""
  date: 2026-10-27T00:35:53.781Z
- commits:
    - subject: Allow running the container without a GPG key
      hash: 5b7be73b47523267b326bed9c04e783a3bc74518
      body: |
        setup.sh runs with `set -u`, so the container exited with
        "GPG_KEY_FILE: unbound variable" when no GPG key was configured, even
        though commit signing is optional (the app only signs if KEY_ID is set)
        and the README's basic `docker run` example doesn't set it. Skip the
        GPG setup when GPG_KEY_FILE is unset or empty.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.3.3
  title: ""
  date: 2026-10-27T00:11:36.023Z
- commits:
    - subject: Check the verification of every commit before signing
      hash: 8b3c4092ae9cff9f916a47661a7404f7b2d16896
      body: |
        Only the first page of a pull request's commits (30 by default) was
        checked, so a PR with an unverified commit beyond the first page would
        still have all of its commits signed with basejump's key during the
        rebase. The endpoint also lists at most 250 commits.

        Paginate the listing, and treat the commits as unverified unless all
        of the pull request's commits could be listed and checked.
      footer:
        See: https://docs.github.com/en/rest/pulls/pulls#list-commits-on-a-pull-request
        see: https://docs.github.com/en/rest/pulls/pulls#list-commits-on-a-pull-request
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.3.2
  title: ""
  date: 2026-10-27T00:05:21.040Z
- commits:
    - subject: Remove the picomatch override
      hash: 4abb0a4bfab273e557a2e85bcd56de8f82c4e91e
      body: |
        The override pinned every copy of picomatch to exactly 4.0.4, which
        forced a different major version onto dependencies requiring ^2
        (micromatch 4 and readdirp 3, via @balena/lint's depcheck), and blocked
        later 4.x releases. The advisory it was added for is fixed in both 2.3.2
        and 4.0.4, which the lockfile now resolves to without an override
        (2.3.2 and 4.0.7), with no remaining picomatch advisories.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.3.1
  title: ""
  date: 2026-10-26T23:54:33.609Z
- commits:
    - subject: Run the TypeScript sources directly with Node.js type stripping
      hash: 558bb73f8bd526aa7c49cf523c2d8550d211588d
      body: |
        Node.js >= 22.18 strips TypeScript types natively, so the sources can
        be run as-is instead of being compiled to `lib` first. This removes the
        build step from the Dockerfile, and with it the need for `typescript`
        to be a production dependency (it's now only a dev dependency, used for
        type checking).

        - run `probot run ./src/index.ts`
        - import modules by their `.ts` paths, which Node.js requires
        - type check with `noEmit`, and enable `verbatimModuleSyntax` and
          `erasableSyntaxOnly` so tsc rejects syntax that type stripping can't
          handle (e.g. enums, parameter properties, type-only imports without
          `import type`)
        - `npm test` now type checks the tests too, not only the sources
        - drop the release tsconfig, `lib` output and rimraf
      footer:
        See: https://nodejs.org/api/typescript.html#type-stripping
        see: https://nodejs.org/api/typescript.html#type-stripping
        Change-type: minor
        change-type: minor
      author: Pagan Gazzard
  version: 0.3.0
  title: ""
  date: 2026-10-26T23:42:38.029Z
- commits:
    - subject: Actually disable request throttling in tests
      hash: 10489417bd4fdce0e27353a551218ee1e7dbf32f
      body: |
        Probot always passes its own `throttle` options (its rate limit
        handlers) when instantiating Octokit, which replace the static
        `throttle: { enabled: false }` default, so throttling stayed enabled
        and every write request in the tests was delayed by a second (~38s for
        the app tests). Merge `enabled: false` into the options on each
        instantiation instead, which brings the app tests down to under 1s.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
  version: 0.2.24
  title: ""
  date: 2026-10-26T22:30:46.271Z
- commits:
    - subject: Require Node.js >= 24
      hash: e5fbd45158e307be61050657b2ace7ffb28923d6
      body: |
        `engines.node` still allowed Node 18, which is end of life and no longer
        supported by the dependencies (e.g. probot 14 requires ^20.18.1 || >=22,
        lint-staged 17.6 >=22.22.1). Require Node 24, which the Docker image
        runs.
      footer:
        Change-type: patch
